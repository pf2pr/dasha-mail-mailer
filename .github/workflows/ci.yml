name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Lint PHP files
        run: find src Tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            symfony: '^6.4'
          - php: '8.2'
            symfony: '^7.4'
          - php: '8.3'
            symfony: '^7.4'
          - php: '8.4'
            symfony: '^8.1'
          - php: '8.5'
            symfony: '^8.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Select Symfony version
        run: |
          composer require --no-update --no-interaction "symfony/mailer:${{ matrix.symfony }}"
          composer require --dev --no-update --no-interaction \
            "symfony/http-client:${{ matrix.symfony }}" \
            "symfony/webhook:${{ matrix.symfony }}" \
            "symfony/remote-event:${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
